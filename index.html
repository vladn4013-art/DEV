<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>VLAD — мини-соцсеть</title>
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --border:#e3e7ee;
    --text:#1c2430;
    --muted:#6b7684;
    --blue:#2563eb;
    --blue-dark:#1d4ed8;
    --blue-soft:#e8efff;
    --danger:#dc2626;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
  }

  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.45;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-text-size-adjust:100%;
  }

  .watermark{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(70px, 22vw, 240px);
    font-weight:800;
    letter-spacing:0.08em;
    color:#0b1a33;
    opacity:0.04;
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
    z-index:0;
    overflow:hidden;
  }

  header, main, footer{ position:relative; z-index:1; }

  .site-header{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--card);
    border-bottom:1px solid var(--border);
  }

  .header-inner{
    max-width:640px;
    margin:0 auto;
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .brand{
    font-size:20px;
    font-weight:800;
    letter-spacing:0.12em;
    color:var(--text);
    white-space:nowrap;
  }

  .brand span{ color:var(--blue); }

  .profile{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }

  .profile label{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }

  .profile input{
    width:160px;
    padding:7px 10px;
    font:inherit;
    font-size:14px;
    color:var(--text);
    background:#fff;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }

  .profile input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(37,99,235,0.14);
  }

  .container{
    width:100%;
    max-width:640px;
    margin:0 auto;
    padding:0 14px;
  }

  main{
    flex:1 0 auto;
    padding:16px 0 8px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
    box-shadow:0 1px 2px rgba(16,24,40,0.04);
  }

  .btn{
    font:inherit;
    font-size:14px;
    font-weight:600;
    padding:9px 14px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
    -webkit-tap-highlight-color:transparent;
    white-space:nowrap;
  }

  .btn:hover{ background:#f2f5fa; }
  .btn:active{ transform:translateY(1px); }

  .btn-primary{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
  }

  .btn-primary:hover{
    background:var(--blue-dark);
    border-color:var(--blue-dark);
  }

  .btn-like.active{
    background:var(--blue-soft);
    border-color:#c7d8ff;
    color:var(--blue-dark);
  }

  .btn-danger{
    background:#fff;
    border-color:#f2d5d5;
    color:var(--danger);
  }

  .btn-danger:hover{ background:#fdf0f0; }

  .btn-sm{
    padding:6px 10px;
    font-size:13px;
  }

  .field{
    display:block;
    width:100%;
    font:inherit;
    font-size:15px;
    color:var(--text);
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    outline:none;
    margin-bottom:10px;
    transition:border-color .15s, box-shadow .15s;
  }

  .field::placeholder{ color:#9aa4b2; }

  .field:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(37,99,235,0.14);
  }

  textarea.field{
    resize:vertical;
    min-height:74px;
    line-height:1.45;
  }

  .composer-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }

  .composer-hint{
    font-size:13px;
    color:var(--muted);
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .composer-hint.error{
    color:var(--danger);
    font-weight:600;
  }

  .post-head{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .avatar{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--blue-soft);
    color:var(--blue-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:15px;
    text-transform:uppercase;
    user-select:none;
  }

  .avatar-sm{
    width:30px;
    height:30px;
    font-size:13px;
  }

  .post-meta{
    flex:1 1 auto;
    min-width:0;
  }

  .post-author{
    font-weight:700;
    font-size:15px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .post-time{
    font-size:12.5px;
    color:var(--muted);
  }

  .post-text{
    margin-top:10px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
  }

  .post-image{
    display:block;
    width:100%;
    max-height:430px;
    object-fit:cover;
    margin-top:10px;
    border-radius:10px;
    background:#eef2f7;
  }

  .post-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }

  .post-actions .btn{
    flex:1 1 0;
    min-width:0;
    text-align:center;
    padding-left:8px;
    padding-right:8px;
  }

  .comments{
    display:none;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
  }

  .comments.open{ display:block; }

  .comment{
    display:flex;
    gap:9px;
    margin-bottom:10px;
  }

  .comment-body{
    flex:1 1 auto;
    min-width:0;
    background:#f5f7fb;
    border-radius:10px;
    padding:8px 11px;
  }

  .comment-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }

  .comment-author{
    font-weight:700;
    font-size:13.5px;
  }

  .comment-time{
    font-size:11.5px;
    color:var(--muted);
  }

  .comment-text{
    font-size:14px;
    margin-top:2px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
  }

  .no-comments{
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:10px;
  }

  .comment-form{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:4px;
  }

  .comment-input{
    flex:1 1 auto;
    min-width:0;
    font:inherit;
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#fff;
    color:var(--text);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }

  .comment-input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(37,99,235,0.14);
  }

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:26px 14px;
  }

  .site-footer{
    flex:0 0 auto;
    margin-top:18px;
    background:var(--card);
    border-top:1px solid var(--border);
    padding:18px 0;
  }

  .site-footer p{
    margin:0;
    text-align:center;
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.01em;
  }

  @media (max-width:520px){
    .header-inner{ padding:10px 12px; }
    .brand{ font-size:17px; letter-spacing:0.1em; }
    .profile label{ display:none; }
    .profile input{ width:126px; font-size:13px; padding:6px 9px; }
    .container{ padding:0 10px; }
    main{ padding-top:12px; }
    .card{ padding:12px; border-radius:11px; margin-bottom:11px; }
    .post-actions .btn{ font-size:13px; padding:8px 6px; }
    .comment-form .btn{ font-size:13px; padding:8px 10px; }
    .field{ font-size:14px; }
    .watermark{ font-size:34vw; }
  }
</style>
</head>
<body>

<div class="watermark" aria-hidden="true">VLAD</div>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">VLAD<span>.</span></div>
    <div class="profile">
      <label for="nameInput">Вы:</label>
      <input id="nameInput" type="text" maxlength="30" placeholder="Ваше имя" autocomplete="off">
    </div>
  </div>
</header>

<main>
  <div class="container">

    <section class="card composer">
      <textarea id="postText" class="field" rows="3" maxlength="1000" placeholder="Что нового?"></textarea>
      <input id="postImage" class="field" type="text" placeholder="Ссылка на картинку (необязательно)" autocomplete="off">
      <div class="composer-foot">
        <span class="composer-hint" id="composerHint"></span>
        <button class="btn btn-primary" id="publishBtn" type="button">Опубликовать</button>
      </div>
    </section>

    <div id="feed"></div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 Copyrighted by Vlad • Все права защищены</p>
  </div>
</footer>

<script>
(function () {
  'use strict';

  /* ==================== ВСТАВЬТЕ ВАШ КЛЮЧ НИЖЕ ==================== */
  const SUPABASE_KEY = 'sb_publishable_HEgOPdG2zlIctLXlgWfe9A_4fFH4AGf';
  const SUPABASE_URL = 'https://' + 'dhmkrkkvbwfljcrlyfyn' + '.supabase.co';

  const LIKED_KEY    = 'vlad_social_liked_v1';
  const NAME_KEY     = 'vlad_social_name_v1';
  const DEFAULT_NAME = 'Влад';
  const GUEST_NAME   = 'Гость';

  const feedEl       = document.getElementById('feed');
  const postText     = document.getElementById('postText');
  const postImage    = document.getElementById('postImage');
  const publishBtn   = document.getElementById('publishBtn');
  const nameInput    = document.getElementById('nameInput');
  const composerHint = document.getElementById('composerHint');

  let sb = null;
  let state = { posts: [] };
  const openComments = new Set();
  const drafts       = new Map();
  let hintTimer      = null;

  function getLikedSet() {

        try { return new Set(JSON.parse(localStorage.getItem(LIKED_KEY) || '[]')); }
    catch (e) { return new Set(); }
  }
  function saveLikedSet(set) {
    try { localStorage.setItem(LIKED_KEY, JSON.stringify(Array.from(set))); } catch (e) {}
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function plural(n, one, few, many) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - Number(ts)) / 1000);
    if (!isFinite(diff) || diff < 60) return 'только что';
    const m = Math.floor(diff / 60);
    if (m < 60) return m + ' ' + plural(m, 'минуту', 'минуты', 'минут') + ' назад';
    const h = Math.floor(m / 60);
    if (h < 24) return h + ' ' + plural(h, 'час', 'часа', 'часов') + ' назад';
    const d = Math.floor(h / 24);
    if (d < 7) return d + ' ' + plural(d, 'день', 'дня', 'дней') + ' назад';
    return new Date(Number(ts)).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function firstLetter(name) {
    const s = String(name || '').trim();
    return s ? s.charAt(0) : '?';
  }

  function currentUser() {
    return (nameInput.value || '').trim() || GUEST_NAME;
  }
  function loadName() {
    try { nameInput.value = localStorage.getItem(NAME_KEY) || DEFAULT_NAME; }
    catch (e) { nameInput.value = DEFAULT_NAME; }
  }
  function saveName() {
    try { localStorage.setItem(NAME_KEY, nameInput.value); } catch (e) {}
  }
  function updateComposerHint() {
    composerHint.classList.remove('error');
    composerHint.textContent = 'Публикация от имени: ' + currentUser();
  }
  function showHint(message, isError) {
    composerHint.textContent = message;
    composerHint.classList.toggle('error', !!isError);
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hintTimer = null; updateComposerHint(); }, 3000);
  }

  async function loadPosts() {
    if (!sb) return;
    const { data, error } = await sb
      .from('posts')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      feedEl.innerHTML = '<div class="card empty">Ошибка базы: ' + esc(error.message) + '</div>';
      return;
    }

    const likedSet = getLikedSet();
    state.posts = (data || []).map(function (row) {
      const idStr = String(row.id);
      return {
        id: idStr,
        rawId: row.id,
        author: row.author || GUEST_NAME,
        text: row.content || '',
        image: row.image || '',
        time: new Date(row.created_at).getTime() || Date.now(),
        likes: Number(row.likes) || 0,
        liked: likedSet.has(idStr),
        comments: Array.isArray(row.comments) ? row.comments : []
      };
    });
    renderFeed();
  }

  function postHTML(post) {
    const user      = currentUser();
    const isOwn     = post.author === user;
    const isOpen    = openComments.has(post.id);
    const draft     = drafts.get(post.id) || '';
    const comments  = post.comments || [];

    const commentsHTML = comments.length
      ? comments.map(function (c) {
          return '<div class="comment">' +
            '<div class="avatar avatar-sm">' + esc(firstLetter(c.author)) + '</div>' +
            '<div class="comment-body">' +
              '<div class="comment-top">' +
                '<span class="comment-author">' + esc(c.author) + '</span>' +
                '<span class="comment-time">' + esc(timeAgo(c.time)) + '</span>' +
              '</div>' +
              '<div class="comment-text">' + esc(c.text) + '</div>' +
            '</div>' +
          '</div>';
        }).join('')
      : '<div class="no-comments">Комментариев пока нет. Будь первым!</div>';

    return '<article class="card post" data-id="' + esc(post.id) + '">' +
      '<div class="post-head">' +
        '<div class="avatar">' + esc(firstLetter(post.author)) + '</div>' +
        '<div class="post-meta">' +
          '<div class="post-author">' + esc(post.author) + '</div>' +
          '<div class="post-time">' + esc(timeAgo(post.time)) + '</div>' +
        '</div>' +
        (isOwn ? '<button class="btn btn-danger btn-sm" type="button" data-action="delete">Удалить</button>' : '') +
      '</div>' +
      (post.text ? '<div class="post-text">' + esc(post.text) + '</div>' : '') +
      (post.image ? '<img class="post-image" src="' + esc(post.image) + '" alt="Изображение" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
      '<div class="post-actions">' +
        '<button class="btn btn-like' + (post.liked ? ' active' : '') + '" type="button" data-action="like">' +
          (post.liked ? '♥ ' : '') + 'Лайк · ' + post.likes +
        '</button>' +
        '<button class="btn" type="button" data-action="toggle-comments">Комментарии · ' + comments.length + '</button>' +
      '</div>' +
      '<div class="comments' + (isOpen ? ' open' : '') + '">' +
        '<div class="comments-list">' + commentsHTML + '</div>' +
        '<form class="comment-form" autocomplete="off">' +
          '<div class="avatar avatar-sm">' + esc(firstLetter(user)) + '</div>' +
          '<input class="comment-input" type="text" maxlength="500" placeholder="Написать комментарий..." value="' + esc(draft) + '">' +
          '<button class="btn btn-primary" type="submit">Отправить</button>' +
        '</form>' +
      '</div>' +
    '</article>';
  }

  function renderFeed() {
    if (!state.posts.length) {
      feedEl.innerHTML = '<div class="card empty">Пока нет постов. Напиши первый!</div>';
      return;
    }
    feedEl.innerHTML = state.posts.map(postHTML).join('');
  }

  function findPost(id) {
    return state.posts.find(function (p) { return p.id === id; }) || null;
  }

  async function handleLike(post) {
    const likedSet = getLikedSet();
    if (post.liked) {
      post.likes = Math.max(0, post.likes - 1);
      post.liked = false;
      likedSet.delete(post.id);
    } else {
      post.likes += 1;
      post.liked = true;
      likedSet.add(post.id);
    }
    saveLikedSet(likedSet);
    renderFeed();

    await sb.from('posts').update({ likes: post.likes }).eq('id', post.rawId);
  }

  function handleToggleComments(postId) {
    if (openComments.has(postId)) openComments.delete(postId);
    else openComments.add(postId);
    renderFeed();
  }

  async function handleDelete(post) {
    if (post.author !== currentUser()) return;
    if (!window.confirm('Удалить этот пост?')) return;

    const { error } = await sb.from('posts').delete().eq('id', post.rawId);
    if (error) { alert('Ошибка удаления: ' + error.message); return; }

    state.posts = state.posts.filter(function (p) { return p.id !== post.id; });
    openComments.delete(post.id);
    drafts.delete(post.id);
    renderFeed();
  }

  async function handleAddComment(formEl) {
    const postEl = formEl.closest('.post');
    if (!postEl) return;
    const postId = postEl.dataset.id;
    const input  = formEl.querySelector('.comment-input');
    const text   = (input.value || '').trim();
    if (!text) { input.focus(); return; }

    const post = findPost(postId);
    if (!post) return;

    const updatedComments = post.comments.concat([{
      id: uid(),
      author: currentUser(),
      text: text,
      time: Date.now()
    }]);

    const { error } = await sb.from('posts').update({ comments: updatedComments }).eq('id', post.rawId);
    if (error) { alert('Ошибка комментария: ' + error.message); return; }

    post.comments = updatedComments;
    drafts.delete(postId);
    openComments.add(postId);
    renderFeed();
  }

  async function publishPost() {
    if (!sb) {
      showHint('Библиотека Supabase еще загружается...', true);
      return;
    }
    const text  = (postText.value || '').trim();
    const image = (postImage.value || '').trim();

    if (!text && !image) {
      showHint('Напишите текст или добавьте ссылку на картинку.', true);
      postText.focus();
      return;
    }

    publishBtn.disabled = true;
    const { error } = await sb.from('posts').insert([{
      author: currentUser(),
      content: text,
      image: image,
      likes: 0,
      comments: []
    }]);
    publishBtn.disabled = false;

    if (error) {
      showHint('Ошибка: ' + error.message, true);
      return;
    }

    postText.value = '';
    postImage.value = '';
    updateComposerHint();
    await loadPosts();
  }

  feedEl.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const postEl = btn.closest('.post');
    if (!postEl) return;
    const post = findPost(postEl.dataset.id);
    if (!post) return;

    if (btn.dataset.action === 'like') handleLike(post);
    else if (btn.dataset.action === 'toggle-comments') handleToggleComments(post.id);
    else if (btn.dataset.action === 'delete') handleDelete(post);
  });

  feedEl.addEventListener('submit', function (e) {
    const form = e.target.closest('.comment-form');
    if (!form) return;
    e.preventDefault();
    handleAddComment(form);
  });

  feedEl.addEventListener('input', function (e) {
    const input = e.target.closest('.comment-input');
    if (!input) return;
    const postEl = input.closest('.post');
    if (postEl) drafts.set(postEl.dataset.id, input.value);
  });

  publishBtn.addEventListener('click', publishPost);

  postText.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      publishPost();
    }
  });

  nameInput.addEventListener('input', function () {
    saveName();
    updateComposerHint();
    renderFeed();
   }); 
  loadName();
  updateComposerHint();
  feedEl.innerHTML = '<div class="card empty">Загрузка ленты...</div>';

  const sdk = document.createElement('script');
  sdk.src = 'https://' + 'cdn.jsdelivr.net' + '/npm/@supabase/supabase-js@2';
  sdk.onload = function () {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    loadPosts();
  };
  sdk.onerror = function () {
    feedEl.innerHTML = '<div class="card empty">Ошибка загрузки SDK.</div>';
  };
  document.body.appendChild(sdk);

  setInterval(function () {
    const active = document.activeElement;
    if (active && feedEl.contains(active)) return;
    loadPosts();
  }, 15000);
})();
</script>
</body>
</html>
